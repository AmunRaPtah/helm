name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
      - '!ios/**/*.md'

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel  # arm64 macos-latest pool kept timing out unacquired (2026-10-28)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Every published build carries a version. ios/VERSION is the release
      # version; the build number is the run number, so builds never collide.
      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d ' \n' < ios/VERSION)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::ios/VERSION must be MAJOR.MINOR.PATCH, got '$VER'"; exit 1; }
          if gh release view "ios-v$VER" >/dev/null 2>&1; then
            echo "::error::ios-v$VER is already released. Bump ios/VERSION and add a CHANGELOG.md entry."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building Helm $VER (${{ github.run_number }})"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned (device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Helm.xcodeproj \
            -scheme Helm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E 'error:|warning: .*deprecated|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100 || true

      - name: Package .app into .ipa
        run: |
          cd "$RUNNER_TEMP"
          APP=$(find dd/Build/Products -maxdepth 2 -name 'Helm.app' -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "No .app found"; find dd/Build/Products -name '*.app'; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Helm.ipa Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' Payload/Helm.app/Info.plist
          cp Helm.ipa "Helm-${{ steps.ver.outputs.version }}.ipa"
          ls -lh Helm*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Helm-ipa
          path: ${{ runner.temp }}/Helm.ipa
          if-no-files-found: error

      - name: Publish releases (versioned + latest)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          # Notes: this version's CHANGELOG section.
          awk -v h="## iOS $VER" 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\nBuild %s, commit %s. Unsigned; sideload with SideStore or AltStore.\n' "$BUILD" "${GITHUB_SHA::7}" >> "$RUNNER_TEMP/notes.md"
          gh release create "ios-v$VER" "$RUNNER_TEMP/Helm-$VER.ipa" \
            --target "$GITHUB_SHA" \
            --title "Helm iOS $VER ($BUILD)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/Helm.ipa" \
            --target "$GITHUB_SHA" \
            --title "Helm (latest: $VER build $BUILD)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
