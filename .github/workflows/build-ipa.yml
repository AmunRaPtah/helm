name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel  # arm64 macos-latest pool kept timing out unacquired (2026-10-28)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned (device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Helm.xcodeproj \
            -scheme Helm \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E 'error:|warning: .*deprecated|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100 || true

      - name: Package .app into .ipa
        run: |
          cd "$RUNNER_TEMP"
          APP=$(find dd/Build/Products -maxdepth 2 -name 'Helm.app' -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "No .app found"; find dd/Build/Products -name '*.app'; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Helm.ipa Payload
          ls -lh Helm.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Helm-ipa
          path: ${{ runner.temp }}/Helm.ipa
          if-no-files-found: error

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)). Sideload with SideStore or AltStore."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/Helm.ipa" \
            --target "$GITHUB_SHA" \
            --title "Helm (latest)" \
            --notes "$NOTES" \
            --latest
