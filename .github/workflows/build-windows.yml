name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - '!windows/**/*.md'

permissions:
  contents: read

concurrency:
  group: build-windows
  cancel-in-progress: true

# This repo is public and windows/src-tauri/creds.bin (the password-sealed
# server address, token and client cert) is git-ignored on purpose. CI builds
# with an empty placeholder, so these installers start but cannot unlock
# ("This build has no sealed credentials."). They prove the build and give a
# clean installer to diff against; a usable one is still built locally with
# tools/seal.py (see windows/README.md). For the same reason nothing is
# published as a GitHub release.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VER=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tauri.conf.json version must be MAJOR.MINOR.PATCH, got '$VER'"; exit 1; }
          grep -q "^## Windows $VER " CHANGELOG.md || echo "::warning::CHANGELOG.md has no '## Windows $VER' section"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building Helm for Windows $VER"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install npm deps
        working-directory: windows
        run: npm ci

      - name: Placeholder credentials (never real ones in CI)
        run: test -f windows/src-tauri/creds.bin || touch windows/src-tauri/creds.bin

      - name: Build installers (NSIS + MSI)
        working-directory: windows
        run: npm run tauri -- build --ci --bundles nsis,msi

      - name: Collect bundles
        id: out
        run: |
          B=windows/src-tauri/target/release/bundle
          ls -l "$B"/nsis "$B"/msi
          echo "dir=$B" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Helm-windows-${{ steps.ver.outputs.version }}-unsealed
          path: |
            ${{ steps.out.outputs.dir }}/nsis/*.exe
            ${{ steps.out.outputs.dir }}/msi/*.msi
          if-no-files-found: error
