<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Lock screen -->
  <section id="lock" class="lock">
    <form id="lock-form" class="lock-card" autocomplete="off">
      <img src="helm-mark.svg" alt="" class="lock-mark" />
      <h1>Helm</h1>
      <p class="muted">Enter your password to unlock.</p>
      <input id="lock-pw" type="password" placeholder="Password" autofocus />
      <button id="lock-btn" type="submit" class="btn primary wide">Unlock</button>
      <p id="lock-err" class="err" role="alert"></p>
      <p class="version small muted" data-version></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="helm-mark.svg" alt="" />
        <span>Helm</span>
      </div>
      <nav class="nav">
        <button data-view="chats" class="nav-btn active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chats</span></button>
        <button data-view="box" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4zM7 7h.01M7 17h.01"/></svg><span>Box</span></button>
        <button data-view="files" class="nav-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg><span>Files</span></button>
      </nav>
      <div id="side-chats" class="side-chats">
        <div class="side-tools">
          <input id="session-filter" type="search" placeholder="Search chats" />
          <button id="new-chat" class="btn primary icon-btn" title="New chat (Ctrl+N)">＋</button>
        </div>
        <ul id="session-list" class="session-list"></ul>
      </div>
      <div class="side-foot">
        <span id="conn" class="conn">connecting…</span>
        <span class="version small muted" data-version></span>
        <button id="lock-now" class="btn ghost" title="Lock (Ctrl+L)">Lock</button>
      </div>
    </aside>

    <main class="main">
      <section id="view-chats" class="view">
        <div id="chat-empty" class="empty">
          <img src="helm-mark.svg" alt="" />
          <h3>Your box, at the helm</h3>
          <p>Pick a chat on the left, or start a new one.</p>
          <button id="empty-new" class="btn primary">New chat <kbd>Ctrl N</kbd></button>
        </div>
        <div id="chat" class="chat hidden">
          <header class="chat-head">
            <span id="chat-badge" class="badge"></span>
            <div class="chat-title">
              <h2 id="chat-title"></h2>
              <span id="chat-sub" class="muted mono small"></span>
            </div>
            <button id="chat-model" class="model-chip hidden" title="Switch model"><i class="mc-dot"></i><span></span><b>▾</b></button>
            <span id="chat-state" class="state"></span>
            <div class="chat-actions">
              <button id="act-interrupt" class="btn warn hidden">Stop</button>
              <button id="act-resume" class="btn primary hidden">Resume</button>
              <button id="act-rename" class="btn ghost">Rename</button>
              <button id="act-delete" class="btn ghost danger">Delete</button>
            </div>
          </header>
          <div id="transcript" class="transcript">
            <div id="items" class="items"></div>
            <div id="pending" class="items"></div>
            <div id="reconnect" class="line reconnect hidden" role="status"></div>
            <div id="typing" class="typing hidden"><i></i><i></i><i></i></div>
          </div>
          <button id="jump" class="jump hidden" title="Jump to latest">↓ Latest</button>
          <footer class="composer">
            <div class="composer-card">
              <ul id="slash" class="slash hidden"></ul>
              <div id="attach-chips" class="chips"></div>
              <textarea id="input" rows="1" placeholder="Message…  / for commands, ! runs a shell command"></textarea>
              <div class="composer-row">
                <button id="attach" class="icon-btn ghost" title="Attach files (or drop them here)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L10.2 18.7a1.7 1.7 0 0 1-2.4-2.4L15.5 8.6"/></svg></button>
                <span class="composer-hint">Enter to send · Shift+Enter for a new line</span>
                <button id="send" class="send-btn" title="Send (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              </div>
            </div>
          </footer>
        </div>
      </section>

      <section id="view-box" class="view hidden">
        <header class="view-head">
          <h2>Box</h2>
          <div class="tabs" id="box-tabs">
            <button data-tab="system" class="tab active">System</button>
            <button data-tab="tmux" class="tab">Tmux</button>
            <button data-tab="services" class="tab">Services</button>
            <button data-tab="burst" class="tab">GPU burst</button>
            <button data-tab="reaper" class="tab">Auto-kill</button>
            <button data-tab="shell" class="tab">Shell</button>
          </div>
        </header>
        <div id="box-body" class="box-body"></div>
      </section>

      <section id="view-files" class="view hidden">
        <header class="view-head">
          <h2>Files</h2>
          <div class="file-tools">
            <button id="f-up" class="btn ghost" title="Up one folder">↑</button>
            <input id="f-path" class="mono" spellcheck="false" />
            <button id="f-refresh" class="btn ghost">Refresh</button>
            <button id="f-mkdir" class="btn ghost">New folder</button>
            <button id="f-upload-dir" class="btn ghost">Upload folder</button>
            <button id="f-upload" class="btn primary">Upload</button>
          </div>
        </header>
        <nav id="f-crumbs" class="crumbs"></nav>
        <div id="f-jobs" class="jobs"></div>
        <div class="files-wrap"><table class="files"><tbody id="f-list"></tbody></table></div>
      </section>
    </main>
  </div>

  <div id="transfers" class="transfers hidden" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <script src="markdown.js"></script>
  <script src="util.js"></script>
  <script src="app.js"></script>
</body>
</html>
